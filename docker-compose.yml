# RNF06: o sistema deve rodar em Docker.
#
#   docker compose up --build
#   frontend -> http://localhost:8080
#   backend  -> http://localhost:3333/api/saude

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procon_chatbot
      POSTGRES_USER: procon
      POSTGRES_PASSWORD: procon
    volumes:
      - postgres_dados:/var/lib/postgresql/data
      - ./app/backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procon -d procon_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3333
      FLUXOS_DIR: /app/fluxos
      CORS_ORIGINS: http://localhost:8080
      REGISTRO_JSONL: /app/dados/interacoes.jsonl
      DATABASE_URL: postgresql://procon:procon@postgres:5432/procon_chatbot
      # Painel Web Administrativo (RF08). Valores de desenvolvimento: troque em producao.
      JWT_SEGREDO: ${JWT_SEGREDO:-dev-segredo-painel-procon-trocar}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@procon.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-procon123}
    volumes:
      - registro:/app/dados
    ports:
      - "3333:3333"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  registro:
  postgres_dados:
